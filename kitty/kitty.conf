tab_bar_edge top



# BEGIN_KITTY_FONTS
font_family      family="Adwaita Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
include themes/noctalia.conf
background_opacity 0.90
confirm_os_window_close 0
enable_audio_bell yes
remember_window_size  no
enabled_layouts splits, stack, grid, fat, tall
remote_control_password "kitty_done_fish" ls
allow_remote_control password



map f1 next_layout
map f2 toggle_layout stack
map ctrl+shift+equal change_font_size all +0.3
map ctrl+shift+minus change_font_size all -0.3
font_size 12.1
